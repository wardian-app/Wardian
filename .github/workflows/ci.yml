name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust Audit
        run: |
          # RUSTSEC-2026-0194 and RUSTSEC-2026-0195 require quick-xml >=0.41.0.
          # Current transitive users are pinned below that range:
          # - tauri-winrt-notification 0.7.2 -> quick-xml ^0.37
          # - plist 1.9.0 -> quick-xml ^0.39.2
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
      - name: NPM Audit
        run: npm audit --audit-level=high

  frontend-quality:
    name: Frontend (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Require frontend screenshot evidence
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq .body)" \
            npm run check:frontend-screenshot -- origin/${{ github.base_ref }} HEAD
      - name: Typecheck
        # local-verify: frontend
        run: npm run typecheck
      - name: Lint
        # local-verify: frontend
        run: npm run lint
      - name: Unit Tests
        # local-verify: frontend
        run: npm run test
      - name: Build Frontend
        # local-verify: frontend
        run: npm run build
      - name: Verify Workbench Cutover
        # local-verify: frontend
        run: npm run check:workbench-cutover
      - name: Verify Test Reachability
        # local-verify: frontend
        run: npm run check:test-reachability
      - name: Verify Dead Code
        # local-verify: frontend
        run: npm run check:deadcode
      - name: Verify Debt Budgets
        # local-verify: frontend
        run: npm run check:budgets
      - name: Verify Page Fixtures
        # local-verify: frontend
        run: npm run check:page-fixtures
      - name: Coverage Report
        run: npm run test:coverage
      - name: Upload Frontend Coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  backend-windows:
    name: Backend (Windows - Lint, Test & Check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Clippy
        # local-verify: backend
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        # local-verify: backend
        run: cargo fmt --all -- --check
      - name: Test
        # local-verify: backend
        run: cargo test --workspace --all-targets -- --test-threads=1

      - name: Run Rust documentation tests
        # local-verify: backend
        run: cargo test --workspace --doc -- --test-threads=1
      # The browser-session suite drives a real Chromium and is `#[ignore]`d so
      # a machine without one still runs the rest. This runner ships Edge, and
      # `engine_candidates()` looks for Edge first, so the 44 tests need no
      # setup here. Set WARDIAN_BROWSER_BINARY if the runner image ever drops
      # it. Without this step the in-app browser has no automated coverage at
      # any layer, which is how it shipped broken twice (#962, #964).
      - name: Test (browser engine)
        run: cargo test --lib browser_session::tests -- --ignored --test-threads=1
        working-directory: src-tauri
      - name: Check Compilation
        # local-verify: backend
        run: cargo check --workspace

  backend-macos-acl:
    name: Backend (macOS - Codex Home ACL)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Test Codex home platform security
        run: cargo test --lib utils::codex_home::platform::tests -- --test-threads=1
        working-directory: src-tauri

  docs-quality:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify llms.txt
        # local-verify: docs
        run: npm run docs:check-llms
      - name: Build documentation
        # local-verify: docs
        run: npm run docs:build

  browser-workbench:
    name: Browser E2E (Workbench & Full Suite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run workbench E2E tests
        run: npm run test:e2e:workbench
        env:
          WARDIAN_HOME: ${{ runner.temp }}\wardian-e2e-browser
      - name: Run full browser E2E suite
        run: npm run test:e2e
        env:
          WARDIAN_HOME: ${{ runner.temp }}\wardian-e2e-browser
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/test-results/

  native-workbench-smoke:
    name: Native Workbench Smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install dependencies
        run: npm ci
      - name: Setup native E2E drivers
        run: npm run setup:e2e:native
      - name: Build native debug app
        run: npm run tauri -- build --debug --no-bundle
        env:
          WARDIAN_HOME: ${{ github.workspace }}\.tmp\e2e-native\wardian-e2e-native-workbench
          WARDIAN_E2E_NATIVE_HOME: ${{ github.workspace }}\.tmp\e2e-native\wardian-e2e-native-workbench
          VITE_WARDIAN_TERMINAL_DEBUG: "1"
      - name: Configure elevated WebView2 automation
        shell: pwsh
        run: |
          # WebView2 150 ignores environment-supplied browser arguments for
          # elevated hosts. GitHub's Windows runner is elevated, while
          # tauri-driver needs this switch to attach to Wardian's WebView.
          $policyPath = "HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $policyPath -Force | Out-Null
          New-ItemProperty `
            -Path $policyPath `
            -Name "Wardian.exe" `
            -Value "--remote-debugging-port=0" `
            -PropertyType String `
            -Force | Out-Null
      # Selects the `ci` tier rather than naming files, so a new native test
      # joins a job by declaring `// @tier ci` instead of being forgotten.
      # `check:test-reachability` fails any native test with no tier at all.
      - name: Run CI-tier native suite
        run: npm run test:e2e:native:ci
        env:
          WARDIAN_HOME: ${{ github.workspace }}\.tmp\e2e-native\wardian-e2e-native-workbench
          WARDIAN_E2E_NATIVE_HOME: ${{ github.workspace }}\.tmp\e2e-native\wardian-e2e-native-workbench
          # WebView2 can intermittently refuse the first native-driver session
          # on elevated GitHub runners. Retry only session startup; test failures
          # still fail immediately.
          WARDIAN_NATIVE_SESSION_START_ATTEMPTS: "3"
      - name: Upload native failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-workbench-results
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}\.tmp\e2e-native\wardian-e2e-native-workbench
            e2e/screenshots/

  backend-linux-coverage:
    name: Backend (Linux - Test & Coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libglib2.0-dev libgtk-3-dev libgdk-pixbuf2.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev libxkbcommon-dev
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Test with Coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/rust-lcov.info
      - name: Upload Backend Coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/rust-lcov.info
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
