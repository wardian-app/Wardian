[package]
name = "wardian-cli"
default-run = "wardian-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wardian-cli"
path = "src/main.rs"

[[bin]]
name = "wardian-mcp"
path = "src/mcp_main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
chrono = { workspace = true }
fs2 = { workspace = true }
tokio = { version = "1.49.0", features = ["io-util", "net", "rt", "time"] }
wardian-core = { path = "../wardian-core" }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
